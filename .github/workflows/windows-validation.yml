name: Windows Beta Candidate Validation

on:
  workflow_dispatch:
    inputs:
      run_ninja_parity:
        description: "Run the broader Ninja backend parity gate after beta candidate smoke"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag used by the optional Windows asset publish job"
        required: false
        default: v0.7.0-beta
        type: string
      publish_windows_asset:
        description: "Publish the Windows x86_64 beta asset to the selected GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows-msys2-ucrt64:
    name: windows beta candidate / msys2-ucrt64-gcc baseline
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QSTAR_WINDOWS_BETA_DIR: dist/windows-beta-candidate
      QSTAR_WINDOWS_BETA_STATUS_DIR: dist/windows-beta-candidate/status
      QSTAR_WINDOWS_ALPHA_DIR: dist/windows-beta-candidate
      QSTAR_WINDOWS_ALPHA_STATUS_DIR: dist/windows-beta-candidate/status
      QSTAR_WINDOWS_NATIVE_ALPHA_ARTIFACT_DIR: dist/windows-beta-candidate/native-alpha-detail
      QSTAR_WINDOWS_EXECUTION_ARTIFACT_DIR: dist/windows-beta-candidate/windows-execution-detail
      QSTAR_WINDOWS_PREP_ARTIFACT_DIR: dist/windows-beta-candidate/windows-prep-detail
      QSTAR_WINDOWS_SHARED_ARTIFACT_DIR: dist/windows-beta-candidate/windows-sharedlib-detail
      QSTAR_WINDOWS_RELEASE_ARTIFACT_DIR: dist/windows-beta-candidate/release-asset-detail
      QSTAR_WINDOWS_BETA_BASELINE: msys2-ucrt64-gcc
      QSTAR_WINDOWS_ALPHA_BASELINE: msys2-ucrt64-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            file
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Record Windows beta candidate environment
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p "$QSTAR_WINDOWS_BETA_DIR" "$QSTAR_WINDOWS_BETA_STATUS_DIR"
          {
            printf 'qstar-windows-beta: baseline=%s\n' "$QSTAR_WINDOWS_BETA_BASELINE"
            printf 'qstar-windows-beta: uname='
            uname -a
            printf 'qstar-windows-beta: pwd=%s\n' "$PWD"
            printf 'qstar-windows-beta: msystem=%s\n' "${MSYSTEM:-unknown}"
            printf 'qstar-windows-beta: shell=%s\n' "${SHELL:-unknown}"
            printf 'qstar-windows-beta: make='
            make --version | head -n 1
            printf 'qstar-windows-beta: gcc='
            gcc --version | head -n 1
            printf 'qstar-windows-beta: ninja='
            ninja --version
            printf 'qstar-windows-beta: zip='
            zip --version | head -n 1
            printf 'qstar-windows-beta: unzip='
            unzip -v | head -n 1
          } | tee "$QSTAR_WINDOWS_BETA_DIR/environment.txt"
          printf 'status=ok step=environment baseline=%s\n' \
            "$QSTAR_WINDOWS_BETA_BASELINE" > "$QSTAR_WINDOWS_BETA_STATUS_DIR/environment.status"

      - name: Build QStar with Makefile bootstrap
        shell: msys2 {0}
        run: |
          set -euo pipefail
          set +e
          make all CC=gcc 2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/make-all.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=make-all cc=gcc\n' > "$QSTAR_WINDOWS_BETA_STATUS_DIR/make-all.status"
          else
            printf 'status=fail step=make-all cc=gcc rc=%s log=make-all.log\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/make-all.status"
          fi
          exit "$rc"

      - name: qstar --version smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          qstar_bin="$PWD/build/bin/qstar"
          if test ! -x "$qstar_bin" && test -x "$PWD/build/bin/qstar.exe"; then
            qstar_bin="$PWD/build/bin/qstar.exe"
          fi
          set +e
          "$qstar_bin" --version 2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/version.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=version bin=%s\n' "$qstar_bin" > "$QSTAR_WINDOWS_BETA_STATUS_DIR/version.status"
          else
            printf 'status=fail step=version rc=%s log=version.log\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/version.status"
          fi
          exit "$rc"

      - name: Run Windows native smoke subset
        shell: msys2 {0}
        run: |
          set -euo pipefail
          set +e
          make qstar-windows-native-alpha-tests CC=gcc \
            2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/native-alpha.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=native-alpha cc=gcc\n' > "$QSTAR_WINDOWS_BETA_STATUS_DIR/native-alpha.status"
          else
            printf 'status=fail step=native-alpha cc=gcc rc=%s log=native-alpha.log detail=native-alpha-detail\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/native-alpha.status"
          fi
          exit "$rc"

      - name: Run Windows execution corpus
        shell: msys2 {0}
        run: |
          set -euo pipefail
          set +e
          make qstar-windows-execution-corpus-tests CC=gcc \
            2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/windows-execution.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=windows-execution cc=gcc corpus=windows-execution\n' \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-execution.status"
          else
            printf 'status=fail step=windows-execution cc=gcc rc=%s log=windows-execution.log detail=windows-execution-detail\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-execution.status"
          fi
          exit "$rc"

      - name: Run Windows path/process prep gate
        shell: msys2 {0}
        run: |
          set -euo pipefail
          set +e
          make qstar-windows-prep-tests CC=gcc \
            2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/windows-prep.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=windows-prep cc=gcc\n' > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-prep.status"
          else
            printf 'status=fail step=windows-prep cc=gcc rc=%s log=windows-prep.log detail=windows-prep-detail\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-prep.status"
          fi
          exit "$rc"

      - name: Run Windows sharedlib artifact parity gate
        shell: msys2 {0}
        run: |
          set -euo pipefail
          set +e
          make qstar-windows-sharedlib-artifact-parity-tests CC=gcc \
            2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/windows-sharedlib.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=windows-sharedlib cc=gcc\n' > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-sharedlib.status"
          else
            printf 'status=fail step=windows-sharedlib cc=gcc rc=%s log=windows-sharedlib.log detail=windows-sharedlib-detail\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-sharedlib.status"
          fi
          exit "$rc"

      - name: Optional Ninja backend parity gate
        if: ${{ inputs.run_ninja_parity }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          set +e
          make qstar-ninja-backend-parity-tests CC=gcc \
            2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/ninja-backend-parity.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=ninja-backend-parity cc=gcc\n' \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/ninja-backend-parity.status"
          else
            printf 'status=fail step=ninja-backend-parity cc=gcc rc=%s log=ninja-backend-parity.log\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/ninja-backend-parity.status"
          fi
          exit "$rc"

      - name: Install prefix docs and manpage smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          prefix=/tmp/qstar-windows-smoke
          rm -rf "$prefix"
          set +e
          (
            set -e
            make install CC=gcc PREFIX="$prefix"
            "$prefix/bin/qstar" --version
            QSTAR_DOC_DIR="$prefix/share/doc/qstar" "$prefix/bin/qstar" docs --path
            test -f "$prefix/share/doc/qstar/wiki/AI_INDEX.md"
            test -f "$prefix/share/man/man1/qstar.1"
            test -f "$prefix/share/man/man5/qstar-lua.5"
          ) 2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/install.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            printf 'status=ok step=install prefix=%s\n' "$prefix" > "$QSTAR_WINDOWS_BETA_STATUS_DIR/install.status"
          else
            printf 'status=fail step=install rc=%s log=install.log\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/install.status"
          fi
          exit "$rc"

      - name: Windows release asset smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          package_dir="$QSTAR_WINDOWS_BETA_DIR/release-package"
          smoke_dir="$QSTAR_WINDOWS_BETA_DIR/release-asset-smoke"
          rm -rf "$package_dir" "$smoke_dir" "$QSTAR_WINDOWS_RELEASE_ARTIFACT_DIR"
          set +e
          QSTAR_WINDOWS_RELEASE_DIST="$package_dir" \
          QSTAR_WINDOWS_RELEASE_SMOKE_DIR="$smoke_dir" \
          QSTAR_WINDOWS_RELEASE_ARTIFACT_DIR="$QSTAR_WINDOWS_RELEASE_ARTIFACT_DIR" \
          QSTAR_WINDOWS_RELEASE_CC=gcc \
            sh tests/windows-release-asset-smoke.sh 2>&1 | tee "$QSTAR_WINDOWS_BETA_DIR/windows-release-asset.log"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
            set +e
            asset=$(find "$package_dir" -name 'qstar-v*-windows-x86_64.zip' -print -quit)
            sha=$(find "$package_dir" -name 'SHA256SUMS' -print -quit)
            plan=$(find "$package_dir" -name 'qstar-v*-windows-x86_64.package-plan.txt' -print -quit)
            smoke_status="$smoke_dir/release-asset.status"
            test -n "$asset"
            test -n "$sha"
            test -n "$plan"
            test -f "$smoke_status"
            grep -F 'archive_format=zip' "$plan"
            grep -F 'binary=bin/qstar.exe' "$plan"
            grep -F "$(basename "$asset")" "$sha"
            grep -F 'status=ok script=windows-release-asset' "$smoke_status"
            verify_rc=$?
            set -e
            if test "$verify_rc" -eq 0; then
              printf 'status=ok step=windows-release-asset asset=%s smoke=%s\n' \
                "$asset" "$smoke_dir" > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-release-asset.status"
            else
              printf 'status=fail step=windows-release-asset rc=%s log=windows-release-asset.log detail=release-asset-detail\n' "$verify_rc" \
                > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-release-asset.status"
              rc=$verify_rc
            fi
          else
            printf 'status=fail step=windows-release-asset rc=%s log=windows-release-asset.log detail=release-asset-detail\n' "$rc" \
              > "$QSTAR_WINDOWS_BETA_STATUS_DIR/windows-release-asset.status"
          fi
          exit "$rc"

      - name: Write beta candidate summary
        if: always()
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p "$QSTAR_WINDOWS_BETA_DIR"
          status_line="$QSTAR_WINDOWS_BETA_DIR/windows-beta-candidate-status.txt"
          legacy_status_line="$QSTAR_WINDOWS_BETA_DIR/windows-alpha-status.txt"
          known="$QSTAR_WINDOWS_BETA_DIR/KNOWN_ISSUES.md"
          {
            printf 'baseline=%s\n' "$QSTAR_WINDOWS_BETA_BASELINE"
            for step in environment make-all version native-alpha windows-execution windows-prep windows-sharedlib ninja-backend-parity install windows-release-asset; do
              file="$QSTAR_WINDOWS_BETA_STATUS_DIR/$step.status"
              if test -f "$file"; then
                cat "$file"
              else
                printf 'status=not-run step=%s\n' "$step"
              fi
            done
          } > "$status_line"
          cp "$status_line" "$legacy_status_line"
          {
            printf '# Windows Beta Candidate Known Issues From This Run\n\n'
            printf '%s\n' "- baseline: \`$QSTAR_WINDOWS_BETA_BASELINE\`"
            printf '%s\n' "- run: \`$GITHUB_RUN_ID\`"
            printf '%s\n' "- daemon named pipe: deferred"
            printf '%s\n' "- native alpha detail dir: \`native-alpha-detail/\` when that script fails"
            printf '%s\n' "- windows execution detail dir: \`windows-execution-detail/\` when that script fails"
            printf '%s\n' "- windows prep detail dir: \`windows-prep-detail/\` when that script fails"
            printf '%s\n' "- windows sharedlib detail dir: \`windows-sharedlib-detail/\` when that script fails"
            printf '%s\n' "- windows release package dir: \`release-package/\` after the asset smoke"
            printf '%s\n' "- windows release smoke dir: \`release-asset-smoke/\` after the extracted asset smoke"
            printf '%s\n' "- windows release asset detail dir: \`release-asset-detail/\` when that script fails"
            if grep -q 'status=fail' "$status_line"; then
              printf '\n## Observed Failures\n\n'
              grep 'status=fail' "$status_line" | while IFS= read -r line; do
                printf '%s\n' "- $line"
              done
            else
              printf '\n## Observed Failures\n\n'
              printf '%s\n' "- none recorded in this run"
            fi
            printf '\n## Deferred By Design\n\n'
            printf '%s\n' "- daemon named pipe transport"
            printf '%s\n' "- Visual Studio, nmake, and direct MSVC bootstrap"
            printf '%s\n' "- Windows GitHub Release publication unless publish_windows_asset=true was run"
            printf '%s\n' "- PDB/debug artifact ownership"
            printf '%s\n' "- MSVC/clang-cl execution corpus"
          } > "$known"
          {
            printf '# Windows Beta Candidate Validation\n\n'
            printf '%s\n' "- workflow: \`$GITHUB_WORKFLOW\`"
            printf '%s\n' '- job: `windows beta candidate / msys2-ucrt64-gcc baseline`'
            printf '%s\n' "- run: \`$GITHUB_RUN_ID\`"
            printf '%s\n' "- baseline: \`$QSTAR_WINDOWS_BETA_BASELINE\`"
            printf '%s\n' '- status: see step result and logs in this artifact'
            printf '%s\n' '- status file: `windows-beta-candidate-status.txt`'
            printf '%s\n' '- known issues file: `KNOWN_ISSUES.md`'
            printf '%s\n' '- failure detail dirs: `native-alpha-detail/`, `windows-execution-detail/`, `windows-prep-detail/`, `windows-sharedlib-detail/` when present'
            printf '%s\n' '- release package dir: `release-package/` contains the Windows zip asset candidate and SHA256SUMS'
            printf '%s\n' '- release smoke dir: `release-asset-smoke/` contains extracted asset smoke logs'
            printf '%s\n' '- support level: validation-backed beta candidate, not official Windows support'
          } > "$QSTAR_WINDOWS_BETA_DIR/SUMMARY.md"

      - name: Upload Windows beta release asset candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qstar-windows-beta-release-asset
          path: |
            dist/windows-beta-candidate/release-package/qstar-v*-windows-x86_64.zip
            dist/windows-beta-candidate/release-package/SHA256SUMS
            dist/windows-beta-candidate/release-package/qstar-v*-windows-x86_64.contents.txt
            dist/windows-beta-candidate/release-package/qstar-v*-windows-x86_64.expected-contents.txt
            dist/windows-beta-candidate/release-package/qstar-v*-windows-x86_64.package-plan.txt
            dist/windows-beta-candidate/release-package/file-windows-x86_64.txt
            dist/windows-beta-candidate/release-package/extract-file-windows-x86_64.txt
            dist/windows-beta-candidate/release-asset-smoke/release-asset.status
            dist/windows-beta-candidate/release-asset-smoke/logs/*.out
            dist/windows-beta-candidate/release-asset-smoke/logs/*.err
          if-no-files-found: warn

      - name: Upload Windows beta candidate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qstar-windows-beta-candidate
          path: dist/windows-beta-candidate
          if-no-files-found: warn

  publish-windows-release-asset:
    name: windows / publish release asset
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_windows_asset }}
    permissions:
      contents: write
    env:
      QSTAR_RELEASE_PLATFORM: windows-x86_64
      QSTAR_RELEASE_TAG: ${{ inputs.release_tag }}
      QSTAR_RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          submodules: recursive

      - name: Install MSYS2 release tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make
            git
            file
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Record Windows release publish environment
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          {
            printf 'qstar-windows-release-publish: tag=%s\n' "$QSTAR_RELEASE_TAG"
            printf 'qstar-windows-release-publish: platform=%s\n' "$QSTAR_RELEASE_PLATFORM"
            printf 'qstar-windows-release-publish: uname='
            uname -a
            printf 'qstar-windows-release-publish: gcc='
            gcc --version | head -n 1
            printf 'qstar-windows-release-publish: ninja='
            ninja --version
            printf 'qstar-windows-release-publish: gh='
            gh --version | head -n 1
          } | tee dist/release/windows-publish-environment.txt

      - name: Run Windows release gates
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -n "$QSTAR_RELEASE_TAG"
          make all CC=gcc
          make qstar-windows-native-alpha-tests CC=gcc
          make qstar-windows-execution-corpus-tests CC=gcc
          make qstar-windows-prep-tests CC=gcc
          make qstar-windows-sharedlib-artifact-parity-tests CC=gcc

      - name: Publish Windows beta release asset
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-github-release-asset.sh

      - name: Download published Windows asset smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          smoke_dir="$PWD/dist/release/download-smoke-windows-x86_64"
          mkdir -p "$smoke_dir"
          QSTAR_RELEASE_PLATFORM=windows-x86_64 \
          QSTAR_RELEASE_TAG="$QSTAR_RELEASE_TAG" \
          QSTAR_RELEASE_SMOKE_DIR="$smoke_dir" \
            make qstar-public-beta-download-smoke | tee "$smoke_dir/download-smoke.log"
          grep -F "qstar-release-download-smoke: status=ok" "$smoke_dir/download-smoke.log"
          test -s "$smoke_dir/download/SHA256SUMS"
          test -s "$smoke_dir/download/contents.txt"
          test -s "$smoke_dir/download/file-windows-x86_64.txt"
          test -s "$smoke_dir/download/docs-show-home.txt"
          test -s "$smoke_dir/download/docs-show-qstar-lua.txt"
          test -s "$smoke_dir/download/build-hello-stella.out"
          test -s "$smoke_dir/download/build-hello-ninja.out"
          test -s "$smoke_dir/download/init-zig.out"
          grep -F "bin/qstar.exe" "$smoke_dir/download/contents.txt"
          grep -F "vendor qstar/languages/zig" "$smoke_dir/download/init-zig.out"

      - name: Write Windows hosted release decision
        shell: msys2 {0}
        run: |
          set -euo pipefail
          decision="dist/release/windows-hosted-release-decision.txt"
          mkdir -p "$(dirname "$decision")"
          {
            printf 'windows_release_asset status=published\n'
            printf 'tag=%s\n' "$QSTAR_RELEASE_TAG"
            printf 'platform=%s\n' "$QSTAR_RELEASE_PLATFORM"
            printf 'download_smoke=ok\n'
            printf 'artifact=qstar-%s-%s.zip\n' "$QSTAR_RELEASE_TAG" "$QSTAR_RELEASE_PLATFORM"
            printf 'reports=download-smoke-windows-x86_64\n'
          } > "$decision"

      - name: Upload published Windows asset reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qstar-windows-x86_64-published-release-asset
          path: |
            dist/release/qstar-v*-windows-x86_64.zip
            dist/release/SHA256SUMS
            dist/release/qstar-v*-windows-x86_64.contents.txt
            dist/release/qstar-v*-windows-x86_64.expected-contents.txt
            dist/release/qstar-v*-windows-x86_64.package-plan.txt
            dist/release/file-windows-x86_64.txt
            dist/release/extract-file-windows-x86_64.txt
            dist/release/windows-publish-environment.txt
            dist/release/download-smoke-windows-x86_64/download/SHA256SUMS
            dist/release/download-smoke-windows-x86_64/download/contents.txt
            dist/release/download-smoke-windows-x86_64/download/file-windows-x86_64.txt
            dist/release/download-smoke-windows-x86_64/download/docs-show-home.txt
            dist/release/download-smoke-windows-x86_64/download/docs-show-qstar-lua.txt
            dist/release/download-smoke-windows-x86_64/download/init-hello.out
            dist/release/download-smoke-windows-x86_64/download/init-zig.out
            dist/release/download-smoke-windows-x86_64/download/build-hello-stella.out
            dist/release/download-smoke-windows-x86_64/download/build-hello-ninja.out
            dist/release/download-smoke-windows-x86_64/download-smoke.log
            dist/release/windows-hosted-release-decision.txt
          if-no-files-found: ignore
