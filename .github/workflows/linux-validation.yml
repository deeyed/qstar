name: Linux Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag used by the optional Linux asset publish job
        required: false
        default: v0.7.0-beta
        type: string
      publish_linux_asset:
        description: Publish the Linux x86_64 beta asset to the selected release
        required: false
        default: false
        type: boolean
      daemon_socket_smoke:
        description: Run the opt-in Linux Stella daemon socket smoke lane
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ubuntu:
    name: ubuntu / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      QSTAR_LINUX_VALIDATION_CC: ${{ matrix.cc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gcc g++ ninja-build file man-db
          ninja --version
          "$CC" --version

      - name: Build QStar
        run: make all

      - name: Run Linux regression
        run: make check

      - name: Run explicit Linux validation gate
        run: make qstar-linux-validation-tests

      - name: Run explicit Ninja backend parity gate
        run: make qstar-ninja-backend-parity-tests

      - name: Medium Stella/Ninja performance line protocol
        run: |
          set -euo pipefail
          mkdir -p dist/perf
          perf_raw="dist/perf/linux-${{ matrix.compiler }}-medium-perf.txt"
          perf_summary="dist/perf/linux-${{ matrix.compiler }}-medium-summary.txt"
          perf_markdown="dist/perf/linux-${{ matrix.compiler }}-medium-summary.md"
          QSTAR_TEST_QSTAR=build/bin/qstar sh tests/medium-project-performance.sh | tee "$perf_raw"
          grep -F "medium_project_gate scheduler runner=posix_spawn event_wait=poll" "$perf_raw"
          grep -F "medium_project_gate backend=ninja phase=clean" "$perf_raw"
          tools/perf-summary.sh "$perf_raw" | tee "$perf_summary"
          tools/perf-summary.sh --format markdown --label "Linux ${{ matrix.compiler }} medium performance" "$perf_raw" > "$perf_markdown"

      - name: Upload Linux medium performance artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qstar-linux-${{ matrix.compiler }}-medium-performance
          path: |
            dist/perf/linux-${{ matrix.compiler }}-medium-perf.txt
            dist/perf/linux-${{ matrix.compiler }}-medium-summary.txt
            dist/perf/linux-${{ matrix.compiler }}-medium-summary.md
          if-no-files-found: ignore

      - name: Install prefix docs and manpage smoke
        run: |
          prefix="${RUNNER_TEMP}/qstar-linux-smoke-${{ matrix.compiler }}"
          make install PREFIX="$prefix"
          "$prefix/bin/qstar" --version
          QSTAR_DOC_DIR="$prefix/share/doc/qstar" "$prefix/bin/qstar" docs --path
          QSTAR_DOC_DIR="$prefix/share/doc/qstar" "$prefix/bin/qstar" docs --ai-index
          QSTAR_DOC_DIR="$prefix/share/doc/qstar" "$prefix/bin/qstar" docs --show reference/qstar-lua.md
          test -f "$prefix/share/doc/qstar/wiki/AI_INDEX.md"
          test -f "$prefix/share/doc/qstar/wiki/reference/qstar-lua.md"
          test -f "$prefix/share/man/man1/qstar.1"
          test -f "$prefix/share/man/man5/qstar-lua.5"
          MANPAGER=cat MANWIDTH=80 man -l "$prefix/share/man/man1/qstar.1" > "${RUNNER_TEMP}/qstar.1.${{ matrix.compiler }}.txt"
          MANPAGER=cat MANWIDTH=80 man -l "$prefix/share/man/man5/qstar-lua.5" > "${RUNNER_TEMP}/qstar-lua.5.${{ matrix.compiler }}.txt"

      - name: Ninja backend root pollution smoke
        run: |
          rm -f .ninja_log .ninja_deps
          build/bin/qstar --file tests/corpus/c-app/qstar.lua -G ninja build //:app --progress plain --color never
          test ! -f .ninja_log
          test ! -f .ninja_deps

      - name: Linux release tarball packaging dry-run
        if: matrix.compiler == 'gcc'
        run: |
          version=$(sed -n 's/^#define QSTAR_VERSION "\(.*\)"/\1/p' include/qstar/qstar.h)
          archive_base="qstar-v${version}-linux-x86_64.tar.gz"
          asset="dist/release/${archive_base}"
          QSTAR_RELEASE_PLATFORM=linux-x86_64 tools/package-public-beta.sh
          test -f "$asset"
          test -f dist/release/SHA256SUMS
          test -s dist/release/file-linux-x86_64.txt
          test -s dist/release/ldd-linux-x86_64.txt
          test -s dist/release/extract-file-linux-x86_64.txt
          test -s dist/release/extract-ldd-linux-x86_64.txt
          test -s dist/release/extract-docs-show-qstar-lua.txt
          grep -F "$archive_base" dist/release/SHA256SUMS
          grep -F "ELF" dist/release/file-linux-x86_64.txt
          grep -E "x86[-_]64|x86-64|AMD x86-64" dist/release/file-linux-x86_64.txt
          tar -tzf "$asset" > dist/release/linux-x86_64.contents.txt
          grep -Fx "bin/qstar" dist/release/linux-x86_64.contents.txt
          grep -Fx "share/doc/qstar/wiki/AI_INDEX.md" dist/release/linux-x86_64.contents.txt
          grep -Fx "share/doc/qstar/wiki/reference/qstar-lua.md" dist/release/linux-x86_64.contents.txt
          grep -Fx "share/man/man1/qstar.1" dist/release/linux-x86_64.contents.txt
          grep -Fx "share/man/man5/qstar-lua.5" dist/release/linux-x86_64.contents.txt
          extract_root="dist/release/qstar-v${version}-linux-x86_64-extract-smoke"
          "$extract_root/bin/qstar" --version
          QSTAR_DOC_DIR="$extract_root/share/doc/qstar" "$extract_root/bin/qstar" docs --path
          QSTAR_DOC_DIR="$extract_root/share/doc/qstar" "$extract_root/bin/qstar" docs --show reference/qstar-lua.md
          MANPAGER=cat MANWIDTH=80 man -l "$extract_root/share/man/man1/qstar.1" > dist/release/linux-x86_64.man1.txt
          MANPAGER=cat MANWIDTH=80 man -l "$extract_root/share/man/man5/qstar-lua.5" > dist/release/linux-x86_64.man5.txt

      - name: Upload Linux release-candidate dry-run artifact
        uses: actions/upload-artifact@v4
        if: matrix.compiler == 'gcc' && always()
        with:
          name: qstar-linux-x86_64-release-candidate-dry-run
          path: |
            dist/release/qstar-v*-linux-x86_64.tar.gz
            dist/release/SHA256SUMS
            dist/release/qstar-v*-linux-x86_64.contents.txt
            dist/release/file-linux-x86_64.txt
            dist/release/ldd-linux-x86_64.txt
            dist/release/docs-show-qstar-lua.txt
            dist/release/extract-file-linux-x86_64.txt
            dist/release/extract-ldd-linux-x86_64.txt
            dist/release/extract-docs-show-qstar-lua.txt
            dist/release/linux-x86_64.contents.txt
            dist/release/linux-x86_64.man1.txt
            dist/release/linux-x86_64.man5.txt
          if-no-files-found: ignore

  daemon-socket-smoke:
    name: ubuntu / daemon socket smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.daemon_socket_smoke }}
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ ninja-build file
          ninja --version
          "$CC" --version

      - name: Build QStar
        run: make all

      - name: Linux Stella daemon socket smoke
        run: |
          set -euo pipefail
          mkdir -p dist/perf
          daemon_tmp="${RUNNER_TEMP}/qstar-daemon-smoke"
          perf_raw="dist/perf/linux-daemon-medium-perf.txt"
          perf_summary="dist/perf/linux-daemon-medium-summary.txt"
          QSTAR_DAEMON_TMPDIR="$daemon_tmp" QSTAR_TEST_QSTAR=build/bin/qstar sh tests/medium-project-performance.sh | tee "$perf_raw"
          grep -F "medium_project_gate backend=stella-daemon phase=clean elapsed_ms=" "$perf_raw"
          grep -F "medium_project_gate backend=stella-daemon phase=noop elapsed_ms=" "$perf_raw"
          grep -F "medium_project_gate backend=stella-daemon phase=incremental elapsed_ms=" "$perf_raw"
          if grep -F "socket-bind-not-permitted" "$perf_raw"; then
            echo "Linux daemon socket smoke unexpectedly skipped" >&2
            exit 1
          fi
          tools/perf-summary.sh "$perf_raw" | tee "$perf_summary"

      - name: Upload Linux daemon socket performance artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qstar-linux-daemon-medium-performance
          path: |
            dist/perf/linux-daemon-medium-perf.txt
            dist/perf/linux-daemon-medium-summary.txt
          if-no-files-found: ignore

  publish-linux-release-asset:
    name: ubuntu / publish linux release asset
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_linux_asset }}
    permissions:
      contents: write
    env:
      CC: gcc
      CXX: g++
      QSTAR_LINUX_VALIDATION_CC: gcc
      QSTAR_RELEASE_PLATFORM: linux-x86_64
      QSTAR_RELEASE_TAG: ${{ inputs.release_tag }}
      QSTAR_RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          submodules: recursive

      - name: Install release build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ ninja-build file man-db
          ninja --version
          "$CC" --version
          gh --version

      - name: Run Linux release gates
        run: |
          set -euo pipefail
          test -n "$QSTAR_RELEASE_TAG"
          make all
          make check
          make qstar-linux-validation-tests
          make qstar-ninja-backend-parity-tests

      - name: Publish Linux beta release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-github-release-asset.sh

      - name: Download published Linux asset smoke
        run: |
          set -euo pipefail
          smoke_dir="$PWD/dist/release/download-smoke-linux-x86_64"
          QSTAR_RELEASE_PLATFORM=linux-x86_64 \
          QSTAR_RELEASE_SMOKE_DIR="$smoke_dir" \
            make qstar-public-beta-download-smoke
          test -s "$smoke_dir/download/file-linux-x86_64.txt"
          test -s "$smoke_dir/download/ldd-linux-x86_64.txt"
          test -s "$smoke_dir/download/docs-show-home.txt"
          test -s "$smoke_dir/download/docs-show-qstar-lua.txt"
          test -s "$smoke_dir/download/man-qstar.1.txt"
          test -s "$smoke_dir/download/man-qstar-lua.5.txt"
          grep -F "ELF" "$smoke_dir/download/file-linux-x86_64.txt"

      - name: Upload published Linux asset reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qstar-linux-x86_64-published-release-asset
          path: |
            dist/release/qstar-v*-linux-x86_64.tar.gz
            dist/release/SHA256SUMS
            dist/release/qstar-v*-linux-x86_64.contents.txt
            dist/release/file-linux-x86_64.txt
            dist/release/ldd-linux-x86_64.txt
            dist/release/extract-file-linux-x86_64.txt
            dist/release/extract-ldd-linux-x86_64.txt
            dist/release/extract-docs-show-qstar-lua.txt
            dist/release/download-smoke-linux-x86_64/download/SHA256SUMS
            dist/release/download-smoke-linux-x86_64/download/file-linux-x86_64.txt
            dist/release/download-smoke-linux-x86_64/download/ldd-linux-x86_64.txt
            dist/release/download-smoke-linux-x86_64/download/docs-show-home.txt
            dist/release/download-smoke-linux-x86_64/download/docs-show-qstar-lua.txt
            dist/release/download-smoke-linux-x86_64/download/man-qstar.1.txt
            dist/release/download-smoke-linux-x86_64/download/man-qstar-lua.5.txt
          if-no-files-found: ignore

  large-performance-report:
    name: ubuntu / large performance report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ ninja-build file
          ninja --version
          "$CC" --version

      - name: Build QStar
        run: make all

      - name: Large synthetic performance line protocol
        run: |
          set -euo pipefail
          mkdir -p dist/perf
          perf_raw="dist/perf/linux-gcc-large-perf.txt"
          perf_summary="dist/perf/linux-gcc-large-summary.txt"
          perf_markdown="dist/perf/linux-gcc-large-summary.md"
          QSTAR_TEST_QSTAR=build/bin/qstar sh tests/large-project-performance.sh | tee "$perf_raw"
          grep -F "large_project_gate mode=200" "$perf_raw"
          grep -F "large_project_gate mode=500" "$perf_raw"
          tools/perf-summary.sh "$perf_raw" | tee "$perf_summary"
          tools/perf-summary.sh --format markdown --label "Linux gcc large synthetic performance" "$perf_raw" > "$perf_markdown"

      - name: Upload Linux large performance artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qstar-linux-gcc-large-performance
          path: |
            dist/perf/linux-gcc-large-perf.txt
            dist/perf/linux-gcc-large-summary.txt
            dist/perf/linux-gcc-large-summary.md
          if-no-files-found: ignore
